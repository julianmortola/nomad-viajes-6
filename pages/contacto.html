<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Nomad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-nomad">
        <div class="container">
            <a class="navbar-brand marca" href="../index.html">Nomad</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNomad" aria-controls="navbarNomad" aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNomad">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="planes.html">Planes</a></li>
                    <li class="nav-item"><a class="nav-link" href="faq.html">Preguntas frecuentes</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <section class="mb-5">
            <h1 class="titulo-principal">Contacto</h1>
            <p>Contanos qué viaje querés hacer y cuáles son tus principales preferencias.</p>
        </section>

        <section class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <form class="formulario">
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input class="form-control campo-interactivo" type="text" id="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Correo electrónico</label>
                        <input class="form-control campo-interactivo" type="email" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="destino">Destino</label>
                        <input class="form-control campo-interactivo" type="text" id="destino">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="mensaje">Mensaje</label>
                        <textarea class="form-control campo-interactivo" id="mensaje" rows="4"></textarea>
                    </div>
                    <button class="btn btn-nomad" type="submit">Enviar consulta</button>
                </form>
            </div>
        </section>
    </main>
    <footer class="pie text-center">
        <p>&copy; 2026 Nomad. Todos los derechos reservados.</p>
        <a class="enlace-pie" href="https://www.instagram.com/" target="_blank">Instagram</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
